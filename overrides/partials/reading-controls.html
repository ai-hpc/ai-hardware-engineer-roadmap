<div class="reading-controls" data-reading-controls role="group" aria-label="Reading view" hidden>
  <span class="reading-controls__label" aria-hidden="true">Reading view</span>
  <div class="reading-controls__actions" id="reading-actions">
    <button class="reading-controls__button" type="button" data-reading-action="navigation" aria-expanded="true">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect x="3" y="4" width="18" height="16" rx="2" />
        <path d="M9 4v16M5.5 8h1M5.5 12h1M5.5 16h1" />
      </svg>
      <span data-reading-label>Hide navigation</span>
    </button>
    <button class="reading-controls__button" type="button" data-reading-action="contents" aria-expanded="true">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect x="3" y="4" width="18" height="16" rx="2" />
        <path d="M15 4v16M17.5 8h1M17.5 12h1M17.5 16h1" />
      </svg>
      <span data-reading-label>Hide contents</span>
    </button>
    <button class="reading-controls__button" type="button" data-reading-action="wide" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M4 8v8M20 8v8M8 12h8M10 9l-3 3 3 3M14 9l3 3-3 3" />
      </svg>
      <span data-reading-label>Wide view</span>
    </button>
    <button class="reading-controls__button" type="button" data-reading-action="fullscreen" aria-pressed="false" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M9 4H4v5M15 4h5v5M20 15v5h-5M9 20H4v-5" />
      </svg>
      <span data-reading-label>Full screen</span>
    </button>
  </div>
  <button class="reading-controls__button reading-controls__toggle" type="button" data-reading-action="toolbar" aria-expanded="true" aria-controls="reading-actions">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M6 15l6-6 6 6" />
    </svg>
    <span data-reading-label>Hide panel</span>
  </button>
  <span class="reading-controls__status" data-reading-status role="status" aria-live="polite"></span>
</div>
