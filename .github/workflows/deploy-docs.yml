name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install mkdocs-material==9.6.* \
                      pymdown-extensions \
                      pillow \
                      cairosvg

      - name: Prepare docs directory
        run: |
          mkdir -p docs
          # Copy all markdown, assets, and images into docs/
          rsync -av --include='*/' \
                    --include='*.md' \
                    --include='*.png' \
                    --include='*.jpg' \
                    --include='*.jpeg' \
                    --include='*.svg' \
                    --include='*.gif' \
                    --include='*.py' \
                    --include='*.css' \
                    --include='robots.txt' \
                    --include='llms.txt' \
                    --exclude='.git' \
                    --exclude='.github' \
                    --exclude='docs' \
                    --exclude='_site' \
                    --exclude='mkdocs.yml' \
                    --exclude='*.html' \
                    ./ docs/

      - name: Build site
        run: mkdocs build --site-dir /tmp/_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
