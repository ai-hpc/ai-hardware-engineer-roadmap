name: Check curriculum links and CPU labs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source Markdown links
        run: python3 scripts/check_links.py
      - name: Install native lab dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++ clang lld qemu-user cmake iverilog libtbb-dev ocl-icd-opencl-dev pocl-opencl-icd ffmpeg python3-gi gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gstreamer1.0-plugins-base device-tree-compiler nodejs
      - name: Test all portable lab suites
        # Ubuntu's Python matches the system PyGObject/GStreamer bindings.
        # Optional frameworks remain explicit skips in the saved result record.
        run: POCL_MAX_PTHREAD_COUNT=2 /usr/bin/python3 scripts/run_portable_checks.py --json /tmp/portable-checks.json

      - name: Retain executed and skipped check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curriculum-cpu-checks
          path: /tmp/portable-checks.json
          if-no-files-found: warn
      - name: Install documentation dependencies
        run: python3 -m pip install -r requirements-docs.txt
      - name: Build documentation strictly
        run: STRICT=1 bash scripts/build_docs_local.sh
