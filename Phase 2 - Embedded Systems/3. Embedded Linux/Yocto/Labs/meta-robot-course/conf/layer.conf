# This teaching layer targets the pinned Scarthgap course baseline.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "robotcourse"
BBFILE_PATTERN_robotcourse = "^${LAYERDIR}/"
BBFILE_PRIORITY_robotcourse = "6"
LAYERDEPENDS_robotcourse = "core"
LAYERSERIES_COMPAT_robotcourse = "scarthgap"
