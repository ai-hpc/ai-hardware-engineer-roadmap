<path d="M600 272 V310" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="30" y="320" width="1140" height="259" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 5"/>
<text x="48" y="347" font-size="17" fill="#475569">PROTOTYPE SoC BOUNDARY — select the implementation level; do not assume integrated RF</text>
