<g font-size="20" font-weight="700"><text x="70" y="413">Linux host CPU</text><text x="466" y="413">AI accelerator</text><text x="862" y="413">Memory + interconnect</text></g>
<g font-size="17" fill="#334155">
<text x="70" y="450">Driver • mapped buffers</text><text x="70" y="480">Submit • wait • timeout • reset</text><text x="70" y="514">CPU ISA ≠ accelerator ABI</text>
<text x="466" y="450">DMA + local SRAM + compute</text><text x="466" y="480">Supported operators + formats</text><text x="466" y="514">Completion and error signals</text>
<text x="862" y="450">External memory + arbitration</text><text x="862" y="480">Bandwidth • live-buffer limits</text><text x="862" y="514">Measure contention and copies</text>
</g>
