<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">One physical memory pool, explicit ownership at every step</title><desc id="desc">Camera DMA produces image buffers in shared DRAM. GPU preprocessing creates model tensors, inference writes action candidates, and CPU validation releases timestamped actions to the controller. Copies, conversions, and completion fences are separate concerns.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect width="1400" height="760" rx="20" fill="#f8fafc"/>
<text x="60" y="65" fill="#0f172a" font-family="sans-serif" font-size="34" font-weight="700">Shared DRAM is a place. Ownership is a protocol.</text>
<text x="60" y="105" fill="#475569" font-family="sans-serif" font-size="21">Jetson prototype → requirements for your physical-AI SoC</text>
<g font-family="sans-serif"><rect x="60" y="155" width="270" height="135" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="82" y="195" fill="#1e3a8a" font-size="25" font-weight="700">1  Capture</text><text x="82" y="232" fill="#1e3a8a" font-size="20">sensor → DMA → buffer</text><text x="82" y="263" fill="#1e3a8a" font-size="18">time • stride • format</text>
<rect x="397" y="155" width="270" height="135" rx="14" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/><text x="419" y="195" fill="#312e81" font-size="25" font-weight="700">2  Preprocess</text><text x="419" y="232" fill="#312e81" font-size="20">GPU transforms pixels</text><text x="419" y="263" fill="#312e81" font-size="18">layout • normalization</text>
<rect x="734" y="155" width="270" height="135" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="756" y="195" fill="#4c1d95" font-size="25" font-weight="700">3  Infer</text><text x="756" y="232" fill="#4c1d95" font-size="20">GPU or AI accelerator</text><text x="756" y="263" fill="#4c1d95" font-size="18">weights • cache • scratch</text>
<rect x="1071" y="155" width="269" height="135" rx="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/><text x="1093" y="195" fill="#134e4a" font-size="25" font-weight="700">4  Validate</text><text x="1093" y="232" fill="#134e4a" font-size="20">CPU → controller</text><text x="1093" y="263" fill="#134e4a" font-size="18">units • bounds • freshness</text></g>
<g stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"><path d="M334 220 H390"/><path d="M671 220 H727"/><path d="M1008 220 H1064"/><path d="M82 294 V364"/><path d="M419 294 V364"/><path d="M756 294 V364"/><path d="M1093 294 V364"/></g>
<g font-family="sans-serif" font-size="16" fill="#475569"><text x="125" y="335">write complete</text><text x="458" y="335">input ready</text><text x="801" y="335">output ready</text><text x="1126" y="335">consume / release</text></g>
<rect x="60" y="375" width="1280" height="145" rx="14" fill="#0f172a"/><g font-family="sans-serif" fill="#f8fafc"><text x="86" y="418" font-size="25" font-weight="700">One physical DRAM budget</text><text x="86" y="459" font-size="21">OS + sensor pool + weights + live activations + KV/state + workspaces + reserve</text><text x="86" y="493" font-size="18" fill="#cbd5e1">Different virtual addresses may refer to the same allocation. Separate allocations still cost bytes and traffic.</text></g>
<g font-family="sans-serif"><text x="65" y="578" fill="#0f172a" font-size="24" font-weight="700">For every arrow, record four things</text><text x="65" y="623" fill="#334155" font-size="21">Allocation + layout</text><text x="405" y="623" fill="#334155" font-size="21">Producer + consumer</text><text x="790" y="623" fill="#334155" font-size="21">Completion fence</text><text x="1125" y="623" fill="#334155" font-size="21">Lifetime + expiry</text>
<text x="65" y="688" fill="#475569" font-size="19">Nano capability check: GPU yes • DLA no • NVENC no. Wireless adds a transport budget, not more control time.</text><text x="65" y="725" fill="#64748b" font-size="17">Original teaching diagram • conceptual data path, not a chip floorplan or measured timing trace</text></g></svg>