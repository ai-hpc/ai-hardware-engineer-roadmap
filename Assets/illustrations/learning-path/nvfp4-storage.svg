   <g id="text_1">
    <text style="fill: #15243a; font: 700 23px 'DejaVu Sans'; text-anchor: start" x="49.392" y="59.074406" transform="rotate(-0 49.392 59.074406)">Four-bit values do not mean a four-bit tensor</text>
   </g>
   <g id="text_2">
    <text style="fill: #516478; font: 11px 'DejaVu Sans'; text-anchor: start" x="49.392" y="87.774281" transform="rotate(-0 49.392 87.774281)">A teaching example of one-dimensional NVFP4 block storage; actual packing and scale layout belong to the backend.</text>
   </g>
   <g id="text_3">
    <text style="fill: #245cbe; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="68.7456" y="162.867169" transform="rotate(-0 68.7456 162.867169)">16 E2M1 VALUES</text>
   </g>
   <g id="text_4">
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(68.7456 188.31585)">16 × 4 bits = 64 bits = 8 bytes</text>
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(68.7456 203.835988)">Magnitudes: 0, 0.5, 1, 1.5, 2, 3, 4, 6</text>
   </g>
   <g id="text_5">
    <text style="fill: #087e83; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="524.9376" y="162.867169" transform="rotate(-0 524.9376 162.867169)">BLOCK SCALE</text>
   </g>
   <g id="text_6">
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(524.9376 188.31585)">1 E4M3 value</text>
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(524.9376 203.835988)">8 bits = 1 byte</text>
   </g>
   <g id="text_7">
    <text style="fill: #a56808; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="770.3136" y="162.867169" transform="rotate(-0 770.3136 162.867169)">GLOBAL SCALE</text>
   </g>
   <g id="text_8">
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(770.3136 188.31585)">FP32, tensor-wide</text>
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(770.3136 203.835988)">32 bits = 4 bytes</text>
   </g>
   <g id="text_9">
    <text style="fill: #516478; font: 24px 'DejaVu Sans'; text-anchor: middle" x="495.216" y="199.0584" transform="rotate(-0 495.216 199.0584)">+</text>
   </g>
   <g id="text_10">
    <text style="fill: #516478; font: 24px 'DejaVu Sans'; text-anchor: middle" x="740.592" y="199.0584" transform="rotate(-0 740.592 199.0584)">+</text>
   </g>
   <g id="text_11">
    <text style="fill: #15243a; font: 17px 'DejaVu Sans'; text-anchor: start" x="66.672" y="317.3256" transform="rotate(-0 66.672 317.3256)">Reconstruction: value = E2M1 payload × block scale × tensor scale</text>
   </g>
   <g id="text_12">
    <text style="fill: #15243a; font: 15px 'DejaVu Sans'; text-anchor: start" x="66.672" y="371.646" transform="rotate(-0 66.672 371.646)">Per 16-value block: 9 bytes → 4.5 bits/value, before the shared global scale.</text>
   </g>
   <g id="text_13">
    <text style="fill: #15243a; font: 15px 'DejaVu Sans'; text-anchor: start" x="66.672" y="417.7152" transform="rotate(-0 66.672 417.7152)">For N values, when N is divisible by 16:  bytes = N/2 + N/16 + 4</text>
   </g>
   <g id="text_14">
    <text style="fill: #516478; font: 11.5px 'DejaVu Sans'; text-anchor: start" x="66.672" y="474.0984" transform="rotate(-0 66.672 474.0984)">Then account for padding, scale swizzles, unquantized tensors, runtime workspaces, and calibration quality.</text>
   </g>
  </g>
 </g>
