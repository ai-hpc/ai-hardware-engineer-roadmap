   <g id="text_1">
    <text style="fill: #15243a; font: 700 23px 'DejaVu Sans'; text-anchor: start" x="49.392" y="59.650406" transform="rotate(-0 49.392 59.650406)">A VLA proposes actions; the local loop owns execution</text>
   </g>
   <g id="text_2">
    <text style="fill: #516478; font: 11px 'DejaVu Sans'; text-anchor: start" x="49.392" y="88.350281" transform="rotate(-0 49.392 88.350281)">Use separate contracts for observation age, policy updates, control ticks, and wireless commands.</text>
   </g>
   <g id="text_3">
    <text style="fill: #245cbe; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="65.2896" y="221.889169" transform="rotate(-0 65.2896 221.889169)">SENSE</text>
   </g>
   <g id="text_4">
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(65.2896 247.33785)">Camera + proprioception</text>
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(65.2896 262.857987)">Timestamp + frame ID</text>
   </g>
   <g id="text_5">
    <text style="fill: #245cbe; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="300.2976" y="221.889169" transform="rotate(-0 300.2976 221.889169)">INFER</text>
   </g>
   <g id="text_6">
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(300.2976 247.33785)">VLA + action adapter</text>
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(300.2976 262.857987)">Chunk + source time</text>
   </g>
   <g id="text_7">
    <text style="fill: #087e83; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="535.3056" y="221.889169" transform="rotate(-0 535.3056 221.889169)">CHECK</text>
   </g>
   <g id="text_8">
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(535.3056 247.33785)">Age, units, bounds</text>
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(535.3056 262.857987)">Fresh action or fallback</text>
   </g>
   <g id="text_9">
    <text style="fill: #a56808; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="770.3136" y="221.889169" transform="rotate(-0 770.3136 221.889169)">CONTROL</text>
   </g>
   <g id="text_10">
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(770.3136 247.33785)">Local control tick</text>
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(770.3136 262.857987)">Actuator + plant</text>
   </g>
   <g id="text_11">
    <text style="fill: #087e83; font: 12px 'DejaVu Sans'; text-anchor: middle" x="495.216" y="357.7824" transform="rotate(-0 495.216 357.7824)">new observations close the loop</text>
   </g>
   <g id="text_12">
    <text style="fill: #087e83; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="300.2976" y="438.483169" transform="rotate(-0 300.2976 438.483169)">OPTIONAL NETWORK / LANGUAGE PLANNER</text>
   </g>
   <g id="text_13">
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(300.2976 463.93185)">Task intent, logs, updates — with expiry and authentication.</text>
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(300.2976 479.451987)">Link loss must not stall the local control tick.</text>
   </g>
   <g id="text_14">
    <text style="fill: #15243a; font: 13px 'DejaVu Sans'; text-anchor: start" x="56.304" y="162.504" transform="rotate(-0 56.304 162.504)">A lower model latency helps only if the accepted action is still useful when applied.</text>
   </g>
  </g>
