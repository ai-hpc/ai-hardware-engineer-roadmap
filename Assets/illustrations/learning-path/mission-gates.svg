   <g id="text_1">
    <text style="fill: #15243a; font: 700 23px 'DejaVu Sans'; text-anchor: start" x="49.392" y="61.378406" transform="rotate(-0 49.392 61.378406)">One mission, nine engineering gates</text>
   </g>
   <g id="text_2">
    <text style="fill: #516478; font: 11px 'DejaVu Sans'; text-anchor: start" x="49.392" y="90.078281" transform="rotate(-0 49.392 90.078281)">Arrows carry reviewed artifacts. Return upstream when a later measurement breaks an assumption.</text>
   </g>
   <g id="text_3">
    <text style="fill: #245cbe; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="65.2896" y="151.419169" transform="rotate(-0 65.2896 151.419169)">01  Specify the robot task</text>
   </g>
   <g id="text_4">
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(65.2896 176.86785)">Task, units, frames, timestamps</text>
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(65.2896 192.387988)">Deadline and fallback contract</text>
   </g>
   <g id="text_5">
    <text style="fill: #245cbe; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="379.7856" y="151.419169" transform="rotate(-0 379.7856 151.419169)">02  Build the model reference</text>
   </g>
   <g id="text_6">
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(379.7856 176.86785)">Data split + preprocessing</text>
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(379.7856 192.387988)">Actions + held-out evaluation</text>
   </g>
   <g id="text_7">
    <text style="fill: #087e83; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="694.2816" y="151.419169" transform="rotate(-0 694.2816 151.419169)">03  Validate the robot loop</text>
   </g>
   <g id="text_8">
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(694.2816 176.86785)">Simulation, resets, action adapter</text>
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(694.2816 192.387988)">Observation age + task success</text>
   </g>
   <g id="text_9">
    <text style="fill: #087e83; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="65.2896" y="295.815169" transform="rotate(-0 65.2896 295.815169)">04  Optimize on real hardware</text>
   </g>
   <g id="text_10">
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(65.2896 321.26385)">Quality gate + measured trace</text>
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(65.2896 336.783988)">Memory, latency, energy budget</text>
   </g>
   <g id="text_11">
    <text style="fill: #245cbe; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="379.7856" y="295.815169" transform="rotate(-0 379.7856 295.815169)">05  Lower the workload</text>
   </g>
   <g id="text_12">
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(379.7856 321.26385)">Graph + legal transformations</text>
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(379.7856 336.783988)">Layouts, buffers, runtime ABI</text>
   </g>
   <g id="text_13">
    <text style="fill: #a56808; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="694.2816" y="295.815169" transform="rotate(-0 694.2816 295.815169)">06  Prototype the accelerator</text>
   </g>
   <g id="text_14">
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(694.2816 321.26385)">Reference vectors + RTL</text>
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(694.2816 336.783988)">DMA/backpressure + timing</text>
   </g>
   <g id="text_15">
    <text style="fill: #a56808; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="65.2896" y="440.211169" transform="rotate(-0 65.2896 440.211169)">07  Integrate Linux and I/O</text>
   </g>
   <g id="text_16">
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(65.2896 465.65985)">Boot image + driver + sensors</text>
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(65.2896 481.179987)">Buffer ownership + recovery</text>
   </g>
   <g id="text_17">
    <text style="fill: #087e83; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="379.7856" y="440.211169" transform="rotate(-0 379.7856 440.211169)">08  Add wireless deliberately</text>
   </g>
   <g id="text_18">
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(379.7856 465.65985)">Command envelope + freshness</text>
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(379.7856 481.179987)">Local control during link loss</text>
   </g>
   <g id="text_19">
    <text style="fill: #245cbe; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="694.2816" y="440.211169" transform="rotate(-0 694.2816 440.211169)">09  Defend the system design</text>
   </g>
   <g id="text_20">
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(694.2816 465.65985)">End-to-end evidence + limits</text>
    <text style="fill: #15243a; font: 11.2px 'DejaVu Sans'" transform="translate(694.2816 481.179987)">FPGA results / ASIC estimates</text>
   </g>
   <g id="text_21">
    <text style="fill: #516478; font: 12px 'DejaVu Sans'; text-anchor: start" x="52.848" y="596.0448" transform="rotate(-0 52.848 596.0448)">Start with one operator and a simulated task. A full custom chip is the destination, not the first lab.</text>
   </g>
  </g>
 </g>
