<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="655" viewBox="0 0 1200 655" role="img" aria-labelledby="title desc"><title id="title">One observation, two contracts</title><desc id="desc">A timestamped camera observation passes through preparation, an accelerator, and action decoding. Linux manages buffers; a separate control task validates freshness and limits. Wireless is a managed control-plane input.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1200" height="655" fill="#f8fafc"/><text x="48" y="56" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#0f172a" text-anchor="start">One observation, two contracts</text><text x="48" y="88" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">The compiler describes tensor work. The system decides when a result is still usable.</text><text x="48" y="136" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#1d4ed8" text-anchor="start">DATA PATH · buffers, shapes, and completion</text><rect x="48" y="156" width="240" height="150" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/><rect x="48" y="156" width="7" height="150" rx="3" fill="#2563eb"/><text x="70" y="192" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">Capture</text><text x="70" y="222" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Sequence + timestamp</text><text x="70" y="248" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Format + stride</text><text x="70" y="274" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Buffer owner</text><rect x="336" y="156" width="240" height="150" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/><rect x="336" y="156" width="7" height="150" rx="3" fill="#2563eb"/><text x="358" y="192" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">Prepare</text><text x="358" y="222" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Layout + normalization</text><text x="358" y="248" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Shape + dtype</text><text x="358" y="274" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Reference tensor</text><rect x="624" y="156" width="240" height="150" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/><rect x="624" y="156" width="7" height="150" rx="3" fill="#2563eb"/><text x="646" y="192" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">Accelerate</text><text x="646" y="222" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Compiled operators</text><text x="646" y="248" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">DMA + scratchpad</text><text x="646" y="274" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Completion event</text><rect x="912" y="156" width="240" height="150" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/><rect x="912" y="156" width="7" height="150" rx="3" fill="#2563eb"/><text x="934" y="192" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">Decode action</text><text x="934" y="222" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Units + coordinate frame</text><text x="934" y="248" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Valid range + state</text><text x="934" y="274" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Output lifetime</text><path d="M293,228 L328,228" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M581,228 L616,228" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M869,228 L904,228" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="48" y="346" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#047857" text-anchor="start">CONTROL PATH · age, deadlines, and recovery</text><rect x="48" y="390" width="336" height="143" rx="16" fill="white" stroke="#059669" stroke-width="2"/><rect x="48" y="390" width="7" height="143" rx="3" fill="#059669"/><text x="70" y="426" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">Linux runtime</text><text x="70" y="456" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Own queues and buffer lifetimes</text><text x="70" y="482" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Trace submission → completion</text><text x="70" y="508" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Handle timeout / device reset</text><rect x="432" y="390" width="336" height="143" rx="16" fill="white" stroke="#059669" stroke-width="2"/><rect x="432" y="390" width="7" height="143" rx="3" fill="#059669"/><text x="454" y="426" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">Control task / MCU</text><text x="454" y="456" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Validate sequence and freshness</text><text x="454" y="482" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Apply limits and watchdog policy</text><text x="454" y="508" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Reject stale or invalid commands</text><rect x="816" y="390" width="336" height="143" rx="16" fill="white" stroke="#059669" stroke-width="2"/><rect x="816" y="390" width="7" height="143" rx="3" fill="#059669"/><text x="838" y="426" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">Wireless + management</text><text x="838" y="456" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Configuration and telemetry</text><text x="838" y="482" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Reconnect and update state</text><text x="838" y="508" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Explicit access to command path</text><path d="M1034,314 L600,382" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 6"/><path d="M392,459 L424,459" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M808,459 L776,459" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="48" y="587" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">Read the solid arrows as data or validated control flow; dashed arrows are coordination.</text><text x="48" y="621" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">Exercise: mark who may read, write, free, or reuse every buffer at each boundary.</text></svg>