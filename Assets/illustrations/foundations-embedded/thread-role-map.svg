<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="666" viewBox="0 0 1200 666" role="img" aria-labelledby="title desc"><title id="title">Thread mesh roles and application freshness</title><desc id="desc">An IP application host connects through a border router to a Thread router mesh. A sleepy end device attaches to a parent and does not route for others. The diagram distinguishes IP reachability from valid application data.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1200" height="666" fill="#f8fafc"/><text x="48" y="55" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" fill="#0f172a" text-anchor="start">A Thread mesh is a routed IPv6 network</text><text x="48" y="90" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">Role, radio behavior, and application meaning are separate design decisions.</text><rect x="48" y="170" width="274" height="132" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/><rect x="48" y="170" width="7" height="132" rx="3" fill="#7c3aed"/><text x="70" y="206" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">IP application host</text><text x="70" y="236" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Linux service / dashboard</text><text x="70" y="262" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Records age + sequence</text><rect x="450" y="170" width="310" height="132" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/><rect x="450" y="170" width="7" height="132" rx="3" fill="#2563eb"/><text x="472" y="206" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">Border router</text><text x="472" y="236" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Routes between IP networks</text><text x="472" y="262" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Router role shown here</text><rect x="877" y="170" width="275" height="132" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/><rect x="877" y="170" width="7" height="132" rx="3" fill="#2563eb"/><text x="899" y="206" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">Thread router</text><text x="899" y="236" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Forwards mesh packets</text><text x="899" y="262" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">One router is leader</text><path d="M330,235 L442,235" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M768,235 L869,235" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="355" y="220" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="600" fill="#475569" text-anchor="start">IPv6</text><text x="778" y="220" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="600" fill="#475569" text-anchor="start">mesh</text><rect x="451" y="407" width="309" height="140" rx="16" fill="white" stroke="#059669" stroke-width="2"/><rect x="451" y="407" width="7" height="140" rx="3" fill="#059669"/><text x="473" y="443" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">Sleepy end device</text><text x="473" y="473" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Polls parent for messages</text><text x="473" y="499" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Does not route for others</text><text x="473" y="525" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Report includes freshness</text><rect x="876" y="407" width="275" height="140" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/><rect x="876" y="407" width="7" height="140" rx="3" fill="#2563eb"/><text x="898" y="443" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">Another router</text><text x="898" y="473" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Provides another path</text><text x="898" y="499" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Can serve child nodes</text><path d="M606,399 L606,310" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M1012,399 L1012,310" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M768,279 L868,445" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="624" y="360" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="600" fill="#475569" text-anchor="start">parent / child</text><text x="48" y="374" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#7c3aed" text-anchor="start">LEARNER CHECK</text><text x="48" y="408" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#334155" text-anchor="start">A ping tests reachability.</text><text x="48" y="443" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#334155" text-anchor="start">An application report tests</text><text x="48" y="470" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#334155" text-anchor="start">units, identity, and age.</text><text x="48" y="596" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="600" fill="#0f172a" text-anchor="start">Failure experiment: restart a parent; record loss, reattachment, duplicates, and stale reports.</text><text x="48" y="630" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="start">This is a conceptual topology. RCP/NCP placement and specific routes depend on the implementation.</text></svg>