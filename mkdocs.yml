site_name: AI Hardware Engineer Roadmap
site_url: https://ai-hpc.github.io/ai-hardware-engineer-roadmap/
site_description: Master AI on hardware. Design VLA-driven physical-AI SoCs with custom accelerators, AI compilers, embedded Linux, and wireless for robots and drones.
site_author: ai-hpc
repo_url: https://github.com/ai-hpc/ai-hardware-engineer-roadmap
repo_name: ai-hpc/ai-hardware-engineer-roadmap
edit_uri: edit/main/

docs_dir: docs

validation:
  links:
    anchors: warn

theme:
  name: material
  custom_dir: overrides
  logo: Assets/images/ai-chip-logo.png
  favicon: Assets/images/ai-chip-logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    # navigation.instant is deliberately NOT enabled. It suppresses Material's
    # scroll-the-sidebar-to-the-active-page behaviour on load, and with a 92-item
    # sidebar that costs the reader their place — verified by build comparison.
    # Losing that cue is worse than the perceived-speed gain.
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    # breadcrumbs: essential once pages sit 5–6 levels deep
    # (Phase 5 › Track G › course › part › lecture)
    - navigation.path
    - navigation.prune
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ai-hpc
    - icon: fontawesome/brands/discord
      link: https://discord.gg/r8DKtDzrsm
      name: Join the Inference Engineering Community on Discord
  seo:
    keywords: AI hardware engineer roadmap, physical AI SoC, vision language action, VLA accelerator, robotics, drones, AI chip design, CUDA programming, Jetson Orin Nano, FPGA development, ML compiler, ML systems engineering, AI infrastructure, distributed training, LLM serving, RISC-V AI accelerator, edge AI, embedded AI, TensorRT, OpenThread, Zigbee, AI agent systems
    image: Assets/images/physical-ai-chip.png
  generator: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - pymdownx.arithmatex:
      generic: true
      # Inline math is \( ... \) only: a bare $ appears in prices all over the roadmap.
      inline_syntax: [round]
      block_syntax: [dollar, square, begin]
  - toc:
      permalink: true
      toc_depth: 3

